name: NeoHeberg AFK Runner

on:
  workflow_dispatch:  # 允许手动触发
  # schedule:
  #   - cron: '0 */5 * * *' # 每 5 小时自动重启一次（绕过超时限制）

# state 文件会被提交回仓库，避免同一时间有两个 run 并发写导致冲突/丢更新
concurrency:
  group: neoheberg-afk
  cancel-in-progress: false

permissions:
  contents: write  # 需要写权限才能把 neoheberg_state.json 提交回仓库

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub 单 job 上限 6 小时，这里留出余量
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests "DrissionPage>=4.0,<5"
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          # ubuntu-latest 自带 Chrome；万一缺失则现装（登录阶段需要真实浏览器）
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Run AFK Script
        env:
          # 账号密码登录（主通道）
          NH_IDENTIFIER: ${{ secrets.NH_IDENTIFIER }}
          NH_PASSWORD: ${{ secrets.NH_PASSWORD }}
          # 可选：__Host-NH-Remember，仍有效时跳过浏览器登录（快速通道）
          NH_REMEMBER: ${{ secrets.NH_REMEMBER }}
          # 可选：Telegram 通知
          NH_TG_BOT_TOKEN: ${{ secrets.NH_TG_BOT_TOKEN }}
          NH_TG_CHAT_ID: ${{ secrets.NH_TG_CHAT_ID }}
          # 可选：Turnstile 在机房 IP 上过不去时，配置优质代理
          # （浏览器登录与 HTTP 挂机走同一出口，保证 IP/UA 口径一致）
          # NH_PROXY: ${{ secrets.NH_PROXY }}
          NH_WAIT: 25
          NH_MAX_ROUNDS: 300
        # 用 xvfb 虚拟屏幕以"有头"模式跑 Chrome：
        # Turnstile 对 headless 检测很严，有头 + 虚拟屏的成功率远高于无头
        run: xvfb-run -a -s "-screen 0 1280x900x24" python3 neoheberg_afk.py

      # 登录失败时，把脚本留下的现场截图（已清空输入框，不含凭据）打包供排查
      - name: Upload login debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: nh_debug_login_*.png
          if-no-files-found: ignore
          retention-days: 3

      # 无论上一步成功/失败，都尝试把最新的 state 文件提交回仓库，
      # 这样下一次 workflow 运行 checkout 出来的就是上一次运行结束时的最新状态
      # （rounds / total / start_balance 等才能真正跨运行持久化）。
      - name: Persist AFK state file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain neoheberg_state.json 2>/dev/null)" ]; then
            echo "状态文件无变化，跳过提交"
            exit 0
          fi

          git add neoheberg_state.json
          git commit -m "chore: update NeoHeberg AFK state [skip ci]"

          # 防止和其他并发 push 冲突（concurrency 已基本避免，此处再加一层保险）
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "推送失败，重试 ($i/3) ..."
            sleep 5
          done
